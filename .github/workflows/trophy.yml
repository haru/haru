name: GitHub-Profile-Trophy

on:
  schedule: # execute every day at 00:30 UTC (09:30 JST)
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-trophy
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # github-profile-trophy.vercel.app is disabled (HTTP 402), so the SVG is
      # generated here and committed instead of being fetched at render time.
      #
      # This is a fork of ryo-ma/github-profile-trophy, pinned to a commit. The
      # upstream action hardcodes maxColumn = -1, i.e. every trophy on one row,
      # which GitHub then shrinks to fit the README width. Only the fork exposes
      # max-cols / max-rows, so it is used to restore the 8x3 wrap that the
      # vercel API rendered by default (CONSTANTS.DEFAULT_MAX_COLUMN / _ROW).
      - uses: Erik-Donath/github-profile-trophy@eb0893b31de06841663555d10aa43eb7cf27952f
        with:
          username: ${{ github.repository_owner }}
          file: images/trophy.svg
          token: ${{ secrets.PROFILE_CARDS || secrets.GITHUB_TOKEN }}
          max-cols: "8"
          max-rows: "3"

      - name: Commit trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/trophy.svg
          git diff --staged --quiet || git commit -m "Generate profile trophy"
          git push
