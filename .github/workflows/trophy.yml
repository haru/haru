name: GitHub-Profile-Trophy

on:
  schedule: # execute every day at 00:30 UTC (09:30 JST)
    - cron: "30 0 * * *"
  workflow_dispatch:

env:
  # ryo-ma/github-profile-trophy @ master, 2026-07-25
  TROPHY_REF: e3c89df995e92e67cdd4b2acaab9d974583dc1f7

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-trophy
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # github-profile-trophy.vercel.app is disabled (HTTP 402), so the SVG is
      # generated here and committed instead of being fetched at render time.
      # Upstream's own action is not used because it hardcodes the grid layout;
      # see .github/scripts/render-trophy.ts.
      - name: Checkout trophy renderer
        uses: actions/checkout@v4
        with:
          repository: ryo-ma/github-profile-trophy
          ref: ${{ env.TROPHY_REF }}
          path: .trophy-src

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Generate trophy
        env:
          GITHUB_TOKEN1: ${{ secrets.PROFILE_CARDS || secrets.GITHUB_TOKEN }}
        run: |
          deno run --allow-net --allow-env --allow-read --allow-write \
            .github/scripts/render-trophy.ts \
            "${{ github.repository_owner }}" images/trophy.svg

      - name: Commit trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/trophy.svg
          git diff --staged --quiet || git commit -m "Generate profile trophy"
          git push
